<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vivtrack 4 Builder</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../brand.css" />
    <link rel="stylesheet" href="../auth.css" />
    <script src="../auth.js"></script>
  </head>
  <body>
    <nav class="app-tabs" aria-label="Application pages">
      <a href="../index.html">Backlit</a>
      <a href="../edgelit.html">Edgelit</a>
      <a class="active" href="index.html">R300</a>
      <a href="../palisade.html">Palisade</a>
      <a href="../cube.html">Cube</a>
      <a href="https://vivad.com.au/shopping-cart">Go to Cart</a>
    </nav>

    <div class="app">
      <aside class="sidebar">
        <img class="brand-logo" src="./assets/vivad-logo-user.png" alt="Vivad" />
        <div class="mast">
          <div>
            <h1>Vivtrack 4 Builder</h1>
          </div>
          <div class="status">Live</div>
        </div>

        <section class="section">
          <h2 class="section-title">Quote Inputs</h2>
          <div class="grid">
            <label class="field full">
              <span>Shortname</span>
              <input id="shortname" type="text" autocomplete="off" />
            </label>

            <label class="field">
              <span>Width mm</span>
              <input id="width" type="number" min="800" step="1" value="3000" inputmode="numeric" />
            </label>

            <label class="field">
              <span>Depth mm</span>
              <input id="length" type="number" min="800" step="1" value="3000" inputmode="numeric" />
            </label>

            <label class="field">
              <span>Height mm</span>
              <input id="height" type="number" min="280" max="3000" step="1" value="1500" inputmode="numeric" />
            </label>

            <label class="field">
              <span>QTY</span>
              <input id="quantity" type="number" min="1" step="1" value="1" inputmode="numeric" />
            </label>

            <label class="field full">
              <span>Shape</span>
              <select id="shape"></select>
            </label>

            <label class="field full">
              <span>Maximum Packing Length</span>
              <select id="maxPacking"></select>
              <small id="packingHint"></small>
            </label>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Graphics</h2>
          <div class="grid">
            <label class="field full">
              <span>Outer Graphic insert</span>
              <select id="outerFabricGroup"></select>
            </label>

            <label class="field">
              <span>Outer QTY</span>
              <input id="outerGraphicQty" type="number" min="0" step="1" value="1" inputmode="numeric" />
            </label>

            <div class="field full">
              <button class="button secondary" type="button" data-template="outer">Download Outer Template</button>
            </div>

            <label class="field full">
              <span>Inner Graphic insert</span>
              <select id="innerFabricGroup"></select>
            </label>

            <label class="field">
              <span>Inner QTY</span>
              <input id="innerGraphicQty" type="number" min="0" step="1" value="1" inputmode="numeric" />
            </label>

            <div class="field full">
              <button class="button secondary" type="button" data-template="inner">Download Inner Template</button>
            </div>

            <div class="field full">
              <button class="button secondary" type="button" data-infill-cut-file>Download Corner Forex Infill Panels</button>
            </div>

            <div class="field full">
              <button class="button secondary" type="button" data-infill-dxf>Download Corner Forex DXF</button>
            </div>

            <label class="check-field full">
              <input id="includeRigging" type="checkbox" />
              <img src="./assets/rigging-point.png" alt="" />
              <span id="riggingLabel">Include Rigging Points</span>
            </label>
          </div>
        </section>
      </aside>

      <main class="main">
        <section class="summary-grid" aria-label="Calculated frame metrics" id="metrics"></section>

        <section class="workspace">
          <div class="left-stack">
            <section class="panel">
              <h2>Layout</h2>
              <div class="diagram-wrap" id="diagram"></div>
              <img class="hero-image secondary-image" src="./assets/halo-frame-user.webp" alt="Aluminium R300 halo frame configuration" />
            </section>

            <section class="panel">
              <h2>Insert Preview</h2>
              <img class="hero-image" src="./assets/halo-inserts-user.webp" alt="R300 Halo fabric display insert" />
              <p class="insert-summary" id="insertSummary"></p>
            </section>
          </div>

          <div class="right-stack">
            <section class="actions-panel">
              <h2>Cart Links</h2>
              <div class="button-grid" id="cartButtons"></div>
              <textarea class="url-box" id="selectedUrl" readonly></textarea>
            </section>

            <section class="panel">
              <h2>Description</h2>
              <textarea class="description-box" id="descriptionText" readonly></textarea>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
