[build]
  command = "mkdir -p .next && cp index.html edgelit.html palisade.html cube.html pricing-bridge.html auth.css auth.js brand.css pricing-config.js vivad-logo.png cube-product.jpg palisade-100mm.jpg palisade-60mm.jpg .next/ && cp -R r300 lanterns .next/"
  publish = ".next"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/vivaframe"
  to = "https://vivaframe-designer-vivad.netlify.app/vivaframe"
  status = 200
  force = true

[[redirects]]
  from = "/vivaframe/*"
  to = "https://vivaframe-designer-vivad.netlify.app/vivaframe/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/_next/*"
  to = "https://vivaframe-designer-vivad.netlify.app/_next/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.svg"
  to = "https://vivaframe-designer-vivad.netlify.app/favicon.svg"
  status = 200
  force = true
