<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Vivalux pricing bridge</title>
  <style>body{font:14px Arial,sans-serif;color:#53565a;margin:32px}h1{font-size:20px}p{line-height:1.5}.connected{color:#548a0c}.disconnected{color:#e4002b}</style>
</head>
<body>
  <h1>Vivalux pricing connection</h1>
  <p id="status">Checking your Vivalux Builder session…</p>
  <script>
    (function () {
      "use strict";
      var SESSION_KEY = "vivalux-auth-session";
      function getUser() {
        try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch { return null; }
      }
      window.VivaluxAuth = {
        getUser: getUser,
        clearPricingToken: function () { try { localStorage.removeItem(SESSION_KEY); } catch {} }
      };
    }());
  </script>
  <script src="pricing-config.js"></script>
  <script>
    (function () {
      "use strict";

      var DESIGNER_ORIGIN = "https://vivaframe-designer-vivad.netlify.app";
      var PRODUCT = "vivaframe";

      function reply(target, id, result, error) {
        target.postMessage({ source: "vivalux-pricing-bridge", id: id, result: result, error: error }, DESIGNER_ORIGIN);
      }

      window.addEventListener("message", function (event) {
        var request = event.data || {};
        if (event.origin !== DESIGNER_ORIGIN || (event.source !== window.parent && event.source !== window.opener) || request.source !== "vivaframe-designer" || !request.id) return;
        if (!window.VivaluxPricing || !window.VivaluxAuth || !window.VivaluxAuth.getUser()) {
          reply(event.source, request.id, null, "Open Vivalux Builder and sign in to connect customer pricing.");
          return;
        }
        if (request.action === "config") {
          window.VivaluxPricing.register(PRODUCT, function (config) {
            reply(event.source, request.id, { config: config }, null);
          }).then(function (connected) {
            if (!connected) reply(event.source, request.id, null, "VivaFrame pricing configuration is unavailable.");
          }).catch(function (error) {
            reply(event.source, request.id, null, error.message || "Pricing Engine is unavailable.");
          });
          return;
        }
        if (request.action === "quote") {
          window.VivaluxPricing.quote(PRODUCT, request.takeoff || {}).then(function (quote) {
            reply(event.source, request.id, quote, null);
          }).catch(function (error) {
            reply(event.source, request.id, null, error.message || "Pricing Engine is unavailable.");
          });
          return;
        }
        reply(event.source, request.id, null, "Unsupported pricing request.");
      });

      var target = window.opener || (window.parent !== window ? window.parent : null);
      var user = window.VivaluxAuth.getUser();
      var status = document.getElementById("status");
      status.className = user && user.pricingToken ? "connected" : "disconnected";
      status.textContent = user && user.pricingToken ? "Pricing connected. Keep this window open while designing." : "Open Vivalux Builder and sign in, then select Connect pricing again.";
      if (target) target.postMessage({ source: "vivalux-pricing-bridge", ready: true }, DESIGNER_ORIGIN);
    }());
  </script>
</body>
</html>
