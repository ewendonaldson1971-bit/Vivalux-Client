<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Vivalux pricing bridge</title>
</head>
<body>
  <p>Vivalux pricing connection</p>
  <script src="auth.js"></script>
  <script src="pricing-config.js"></script>
  <script>
    (function () {
      "use strict";

      var DESIGNER_ORIGIN = "https://vivaframe-designer-vivad.netlify.app";
      var PRODUCT = "vivaframe";

      function reply(target, id, result, error) {
        target.postMessage({ source: "vivalux-pricing-bridge", id: id, result: result, error: error }, DESIGNER_ORIGIN);
      }

      window.addEventListener("message", function (event) {
        var request = event.data || {};
        if (event.origin !== DESIGNER_ORIGIN || event.source !== window.parent || request.source !== "vivaframe-designer" || !request.id) return;
        if (!window.VivaluxPricing || !window.VivaluxAuth || !window.VivaluxAuth.getUser()) {
          reply(event.source, request.id, null, "Open Vivalux Builder and sign in to connect customer pricing.");
          return;
        }
        if (request.action === "config") {
          window.VivaluxPricing.register(PRODUCT, function (config) {
            reply(event.source, request.id, { config: config }, null);
          }).then(function (connected) {
            if (!connected) reply(event.source, request.id, null, "VivaFrame pricing configuration is unavailable.");
          }).catch(function (error) {
            reply(event.source, request.id, null, error.message || "Pricing Engine is unavailable.");
          });
          return;
        }
        if (request.action === "quote") {
          window.VivaluxPricing.quote(PRODUCT, request.takeoff || {}).then(function (quote) {
            reply(event.source, request.id, quote, null);
          }).catch(function (error) {
            reply(event.source, request.id, null, error.message || "Pricing Engine is unavailable.");
          });
          return;
        }
        reply(event.source, request.id, null, "Unsupported pricing request.");
      });

      window.parent.postMessage({ source: "vivalux-pricing-bridge", ready: true }, DESIGNER_ORIGIN);
    }());
  </script>
</body>
</html>
